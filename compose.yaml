services:
  ml-service:
    build: ./ml-service
    image: j26-ml-service:pp1
    environment:
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s

  backend:
    build: ./backend
    image: j26-backend:pp1
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      ML_SERVICE_URL: http://ml-service:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      ml-service:
        condition: service_healthy
