services:
  ml-service:
    build: ./ml-service
    image: j26-ml-service:pp1
    environment:
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
